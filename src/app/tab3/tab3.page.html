<ion-header>
  <ion-toolbar>
    <ion-title>Inspección Pre-Viaje</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Tarjeta de progreso -->
  <ion-card>
    <ion-card-content>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <strong>Progreso de revisión</strong>
        <ion-badge [color]="listaCompleta ? 'success' : 'warning'">
          {{ completados }} / {{ items.length }}
        </ion-badge>
      </div>
      <ion-progress-bar
        [value]="progreso"
        [color]="listaCompleta ? 'success' : 'warning'">
      </ion-progress-bar>
      <p *ngIf="listaCompleta" style="color: var(--ion-color-success); margin-top: 10px; display: flex; align-items: center; gap: 6px;">
        <ion-icon name="checkmark-done-circle-outline"></ion-icon>
        <strong>¡Moto lista para rodar seguro!</strong>
      </p>
    </ion-card-content>
  </ion-card>

  <!-- Checklist -->
  <ion-list>
    <ion-item *ngFor="let item of items">
      <ion-checkbox slot="start" [(ngModel)]="item.revisado" color="warning"></ion-checkbox>
      <ion-label class="ion-text-wrap">
        <h2 [style.text-decoration]="item.revisado ? 'line-through' : 'none'">
          <strong>{{ item.titulo }}</strong>
        </h2>
        <p>{{ item.descripcion }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Botones de acción -->
  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
    <ion-button expand="block" fill="outline" color="medium" (click)="reiniciarLista()">
      <ion-icon slot="start" name="refresh-outline"></ion-icon>
      Reiniciar lista
    </ion-button>

    <ion-button expand="block" color="warning" (click)="irADiagnostico()">
      <ion-icon slot="start" name="medkit-outline"></ion-icon>
      ¿Detectaste una falla? Guía de diagnóstico
    </ion-button>
  </div>
</ion-content>
