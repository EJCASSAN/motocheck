<ion-content>
  <div class="mc-page">
    <nav class="mc-row-between" aria-label="Volver">
      <button type="button" class="mc-back" (click)="volver()">
        <ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon>
        Ajustes
      </button>
      <button type="button" class="mc-back restaurar" (click)="restaurar()">Valores por defecto</button>
    </nav>

    <header>
      <h1 class="mc-title">Intervalos de servicio</h1>
      <p class="mc-muted">Cada cuántos kilómetros toca cada mantenimiento. Revisa el manual de tu moto.</p>
    </header>

    <section class="aviso">
      <span id="lbl-aviso" class="etiqueta">Avisarme en amarillo al llegar al…</span>
      <div class="segmentos" role="radiogroup" aria-labelledby="lbl-aviso">
        @for (u of umbrales; track u) {
        <button
          type="button"
          role="radio"
          class="segmento"
          [class.on]="config.umbralAmarillo === u"
          [attr.aria-checked]="config.umbralAmarillo === u"
          (click)="config.umbralAmarillo = u"
        >
          {{ u }}%
        </button>
        }
      </div>
    </section>

    <ul class="mc-card lista">
      @for (t of tipos; track t) {
      <li>
        <div class="nombre">
          <span>{{ nombres[t] }}</span>
          <small class="mc-muted">cada</small>
        </div>
        <button
          type="button"
          class="paso"
          [attr.aria-label]="'Reducir ' + nombres[t]"
          [disabled]="config.intervalosKm[t] <= minimo"
          (click)="cambiar(t, -1)"
        >
          −
        </button>
        <span class="valor mc-display">{{ miles(config.intervalosKm[t]) }} km</span>
        <button type="button" class="paso" [attr.aria-label]="'Aumentar ' + nombres[t]" (click)="cambiar(t, 1)">
          +
        </button>
      </li>
      }
    </ul>

    <button type="button" class="mc-btn primary" (click)="guardar()">Guardar intervalos</button>
  </div>
</ion-content>
