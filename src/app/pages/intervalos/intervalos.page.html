<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/ajustes"></ion-back-button>
    </ion-buttons>
    <ion-title>Intervalos (km)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p style="margin-top: 0; color: var(--ion-color-medium);">
    Define cada cuántos kilómetros deseas recibir alertas preventivas.
  </p>

  <ion-item fill="outline" class="ion-margin-bottom">
    <ion-input label="Aceite de motor (km)" labelPlacement="stacked" type="number" [(ngModel)]="config.intervalosKm.aceite"></ion-input>
  </ion-item>

  <ion-item fill="outline" class="ion-margin-bottom">
    <ion-input label="Tensión de cadena (km)" labelPlacement="stacked" type="number" [(ngModel)]="config.intervalosKm.cadena"></ion-input>
  </ion-item>

  <ion-item fill="outline" class="ion-margin-bottom">
    <ion-input label="Filtro de aire (km)" labelPlacement="stacked" type="number" [(ngModel)]="config.intervalosKm.filtros"></ion-input>
  </ion-item>

  <ion-item fill="outline" class="ion-margin-bottom">
    <ion-input label="Bujías (km)" labelPlacement="stacked" type="number" [(ngModel)]="config.intervalosKm.bujias"></ion-input>
  </ion-item>

  <ion-item fill="outline" class="ion-margin-bottom">
    <ion-input label="Pastillas de freno (km)" labelPlacement="stacked" type="number" [(ngModel)]="config.intervalosKm.frenos"></ion-input>
  </ion-item>

  <ion-item fill="outline" class="ion-margin-bottom">
    <ion-input label="Kit de arrastre (km)" labelPlacement="stacked" type="number" [(ngModel)]="config.intervalosKm.kit_arrastre"></ion-input>
  </ion-item>

  <!-- Umbral de alerta amarilla -->
  <ion-item lines="none" class="ion-margin-vertical">
    <ion-label>
      <h2>Alerta preventiva (amarillo): <strong>{{ config.umbralAmarillo }}%</strong></h2>
      <ion-range
        min="70"
        max="90"
        step="10"
        color="warning"
        [(ngModel)]="config.umbralAmarillo">
      </ion-range>
    </ion-label>
  </ion-item>

  <ion-text color="success" *ngIf="guardado">
    <p style="text-align: center; font-weight: 600;">¡Intervalos guardados!</p>
  </ion-text>

  <ion-button expand="block" color="warning" (click)="guardarIntervalos()">
    <ion-icon slot="start" name="save-outline"></ion-icon>
    Guardar intervalos
  </ion-button>
</ion-content>
